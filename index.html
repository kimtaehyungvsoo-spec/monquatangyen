<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe9ef">
<title>Gửi bạn một lời chúc 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe9ef;--ink:#7a2e4d;--pink:#ff8fb1;--mint:#bfeedd;--sun:#ffe08a;}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Quicksand',sans-serif;color:var(--ink);background:
radial-gradient(circle at 20% 20%,#fff 0 6px,transparent 7px) 0 0/60px 60px,
radial-gradient(circle at 70% 70%,#ffc6d9 0 5px,transparent 6px) 0 0/60px 60px,var(--bg);
overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.sticker{position:fixed;font-size:clamp(28px,5vw,52px);animation:float 5s ease-in-out infinite;pointer-events:none;user-select:none}
@keyframes float{50%{transform:translateY(-14px) rotate(8deg)}}
#stage{position:relative;z-index:2;width:min(92vw,560px);padding:24px}
#wish{font-family:'Pacifico',cursive;font-size:clamp(26px,6vw,44px);line-height:1.4;min-height:3em}
#wish .w{display:inline-block;white-space:nowrap;font-weight:inherit}
#wish{word-break:keep-all;overflow-wrap:normal}
#wish span{display:inline-block;opacity:0;transform:translateY(14px) scale(.8);animation:pop .5s forwards}
@keyframes pop{to{opacity:1;transform:none}}
#photos{display:none;flex-direction:column;align-items:center;gap:14px}
.frame{width:min(70vw,320px);aspect-ratio:3/4;background:#fff;padding:10px 10px 36px;border-radius:10px;box-shadow:0 10px 30px #c9547f40;transform:rotate(var(--r));animation:drop .8s cubic-bezier(.2,1.4,.4,1)}
.frame img{width:100%;height:100%;object-fit:cover;border-radius:6px;background:var(--mint)}
.frame p{margin-top:6px;font-weight:700;font-size:15px}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(0) scale(.7)}}
#start{font:700 18px Quicksand;border:0;border-radius:99px;padding:14px 30px;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 6px 0 #d9567f}
#start:active{transform:translateY(4px);box-shadow:0 2px 0 #d9567f}
:root{--card:#fffafc}
#stage{background:var(--card);border-radius:36px;border:4px dashed var(--pink);box-shadow:0 12px 0 #ffc6d9,0 20px 40px #c9547f30;padding:34px 24px}
#stage::before,#stage::after{content:"🎀";position:absolute;font-size:44px;top:-26px}
#stage::before{left:-14px;transform:rotate(-20deg)}#stage::after{right:-14px;transform:rotate(20deg)}
#flags{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-around;pointer-events:none}
#flags
